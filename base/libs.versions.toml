asm = { module = "org.ow2.asm:asm", version.ref = "asm" }
asm-analysis = { module = "org.ow2.asm:asm-analysis", version.ref = "asm" }
asm-commons = { module = "org.ow2.asm:asm-commons", version.ref = "asm" }
asm-tree = { module = "org.ow2.asm:asm-tree", version.ref = "asm" }
asm-util = { module = "org.ow2.asm:asm-util", version.ref = "asm" }

bundle-tool = "com.android.tools.build:bundletool:1.18.3"
androidx-databinding-databinding-compiler-common = { module = "androidx.databinding:databinding-compiler-common", version.ref = "build" }
androidx-databinding-databinding-common = { module = "androidx.databinding:databinding-common", version.ref = "build" }
com-android-databinding-baseLibrary = { module = "com.android.databinding:baseLibrary", version.ref = "build" }
com-android-signflinger = { module = "com.android:signflinger", version.ref = "build" }
com-android-tools-annotations = { module = "com.android.tools:annotations", version.ref = "base" }
com-android-tools-common = { module = "com.android.tools:common", version.ref = "base" }
com-android-tools-analyticsLibrary-crash = { module = "com.android.tools.analytics-library:crash", version.ref = "base" }
com-android-tools-analyticsLibrary-protos = { module = "com.android.tools.analytics-library:protos", version.ref = "base" }
com-android-tools-analyticsLibrary-shared = { module = "com.android.tools.analytics-library:shared", version.ref = "base" }
com-android-tools-analyticsLibrary-tracker = { module = "com.android.tools.analytics-library:tracker", version.ref = "base" }
com-android-tools-apkparser-apkanalyzer = { module = "com.android.tools.apkparser:apkanalyzer", version.ref = "base" }
com-android-tools-build-apksig = { module = "com.android.tools.build:apksig", version.ref = "build" }
com-android-tools-build-apkzlib = { module = "com.android.tools.build:apkzlib", version.ref = "build" }
com-android-tools-build-standaloneTools = { module = "com.android.tools.build:standalone-tools", version.ref = "build" }
com-android-tools-ddms-ddmlib = { module = "com.android.tools.ddms:ddmlib", version.ref = "base" }
com-android-tools-ddms-ddmlibtest = { module = "com.android.tools.ddms:ddmlib-test", version.ref = "base" }
com-android-tools-layoutlib-layoutlibApi = { module = "com.android.tools.layoutlib:layoutlib-api", version.ref = "base" }
com-android-tools-fakeadbserver-fakeadbserver = { module = "com.android.tools.fakeadbserver:fakeadbserver", version.ref = "base" }
com-android-tools-lint-lintTypedefRemover = { module = "com.android.tools.lint:lint-typedef-remover", version.ref = "base" }
com-android-tools-lint-lintModel = { module = "com.android.tools.lint:lint-model", version.ref = "base" }
com-android-tools-testutils = { module = "com.android.tools:testutils", version.ref = "base" }
com-android-tools-repository = { module = "com.android.tools:repository", version.ref = "base" }
com-android-tools-sdklib = { module = "com.android.tools:sdklib", version.ref = "base" }
com-android-tools-sdkCommon = { module = "com.android.tools:sdk-common", version.ref = "base" }
com-android-zipflinger = { module = "com.android:zipflinger", version.ref = "build" }
aapt2-proto = "com.android.tools.build:aapt2-proto:7.0.0-beta04-7396180"
dokka-core = "org.jetbrains.dokka:dokka-core:2.2.0"

flatbuffers = "com.google.flatbuffers:flatbuffers-java:1.12.0"
grpc-testing = { module = "io.grpc:grpc-testing", version.ref = "grpc" }
gson = "com.google.code.gson:gson:2.11.0"
guava = { module = "com.google.guava:guava", version.ref = "guava" }
intellij-annotations = "org.jetbrains:annotations:13.0"
javawriter = "com.squareup:javawriter:2.5.0"
jcommander = "com.beust:jcommander:1.78"
javapoet = "com.squareup:javapoet:1.13.0"
jaxb-runtime = { module = "org.glassfish.jaxb:jaxb-runtime", version.ref = "jaxb" }
javax-inject = "javax.inject:javax.inject:1"
jimfs = "com.google.jimfs:jimfs:1.1"
jopt = "net.sf.jopt-simple:jopt-simple:4.9"
juniversalchardet = "com.googlecode.juniversalchardet:juniversalchardet:1.0.3"
gradle-tooling-api = "org.gradle:gradle-tooling-api:9.7.1"
kotlin-coroutines-core = { module = "org.jetbrains.kotlinx:kotlinx-coroutines-core", version.ref = "kotlinCoroutines" }

# Kotlin dependencies used to compile and build the Android Gradle plugin itself
kotlin-gradle-plugin-forAgpBuild = { module = "org.jetbrains.kotlin:kotlin-gradle-plugin", version.ref = "kotlinForAgpBuild" }
kotlin-reflect-forAgpBuild = { module = "org.jetbrains.kotlin:kotlin-reflect", version.ref = "kotlinForAgpBuild" }

# Kotlin dependencies bundled with / depended on by the Android Gradle Plugin
kotlin-gradle-plugin = { module = "org.jetbrains.kotlin:kotlin-gradle-plugin", version.ref = "kotlin" }
kotlin-gradle-plugin-api = { module = "org.jetbrains.kotlin:kotlin-gradle-plugin-api", version.ref = "kotlin" }
kotlin-gradle-plugin-idea = { module = "org.jetbrains.kotlin:kotlin-gradle-plugin-idea", version.ref = "kotlin" }
kotlin-stdlib = { module = "org.jetbrains.kotlin:kotlin-stdlib", version.ref = "kotlin" }
kotlin-test = { module = "org.jetbrains.kotlin:kotlin-test", version.ref = "kotlin" }

# Kotlin dependencies used to compile and run AGP tests -- these are usually updated together with the Kotlin
# dependencies used to build AGP above
compose-compiler-gradle-plugin = { module = "org.jetbrains.kotlin:compose-compiler-gradle-plugin", version.ref = "kotlin" }
ksp-gradle-plugin = "com.google.devtools.ksp:symbol-processing-gradle-plugin:2.2.10-2.0.2"

jetifier-core = { module = "com.android.tools.build.jetifier:jetifier-core", version.ref = "jetifier" }
jetifier-processor = { module = "com.android.tools.build.jetifier:jetifier-processor", version.ref = "jetifier" }

# Proto runtime version differs to the proto compiler version (tools/base/bazel/proto.bzl)
# We do not want to unnecessarily update the compiler version as it can cause issues specifically
# to user who bring in older versions of protoc in parent classloaders of AGP.
# Important note: We should keep the major versions of the compiler and the runtime same to avoid
# potential compatibility issues
protobuf = { module = "com.google.protobuf:protobuf-java", version.ref = "protobuf" }
protobuf-util = { module = "com.google.protobuf:protobuf-java-util", version.ref = "protobuf" }
proto-compiler = { module = "com.google.protobuf:protoc", version.ref = "protoCompiler" }
protobuf-gradle-plugin = "com.google.protobuf:protobuf-gradle-plugin:0.10.0"

tensorflow-lite-metadata = "org.tensorflow:tensorflow-lite-metadata:0.2.0"

#When updating jacoco versions also update JacocoOptions.DEFAULT_VERSION
jacoco-agent = { module = "org.jacoco:org.jacoco.agent", version.ref = "jacoco" }
jacoco-core = { module = "org.jacoco:org.jacoco.core", version.ref = "jacoco" }
jacoco-report = { module = "org.jacoco:org.jacoco.report", version.ref = "jacoco" }

# Include test dependencies here as well, so that we take them into
# consideration when computing version numbers.
equalsverifier = "nl.jqno.equalsverifier:equalsverifier:3.15.6"
google-api-client = "com.google.api-client:google-api-client:1.35.2"
google-storage-client = "com.google.apis:google-api-services-storage:v1-rev20230301-2.0.0"
google-testing-client = "com.google.apis:google-api-services-testing:v1-rev20250327-2.0.0"
google-toolresults-client = "com.google.apis:google-api-services-toolresults:v1beta3-rev20230410-2.0.0"
jsoup = "org.jsoup:jsoup:1.23.2"
junit = "junit:junit:4.13.2"
junit-platform-commons = { module = "org.junit.platform:junit-platform-commons", version.ref = "junitPlatform" }
junit-platform-engine = { module = "org.junit.platform:junit-platform-engine", version.ref = "junitPlatform" }
junit-platform-reporting = { module = "org.junit.platform:junit-platform-reporting", version.ref = "junitPlatform" }
mockito-core = "org.mockito:mockito-core:5.20.0"
mockito-kotlin = "org.mockito.kotlin:mockito-kotlin:5.4.0"
smali-dexlib = "com.android.tools.smali:smali-dexlib2:3.0.9"
truth = "com.google.truth:truth:0.44"
tink = "com.google.crypto.tink:tink:1.15.0"
jarjar = "com.googlecode.jarjar:jarjar:1.3"
android-test-result-proto = { module = "com.android.tools.androidtest:test-result-proto", version.ref = "build" }
