# Versions of external dependencies used by the gradle plugin.
# ATTENTION: This file should be in sync with tools/base/bazel/maven/artifacts.bzl.

[versions]
# Overridden dynamically by settings-real.gradle
base = "0.0.0-dev"
build = "0.0.0-dev"

asm = "9.9"
grpc = "1.69.1"
guava = "33.3.1-jre"
jaxb = "2.3.2"
kotlinCoroutines = "1.6.4"
kotlin = "2.2.10"
kotlinForAgpBuild = "2.3.20"
jetifier = "1.0.0-beta10"
protobuf = "3.25.5"
protoCompiler = "3.25.5"
jacoco = "0.8.14"
googleApiServices = "v1-rev82-1.22.0"
junitPlatform = "1.13.3"

[libraries]


antlr4 = "org.antlr:antlr4:4.5.3"
apache-commons-io = "commons-io:commons-io:2.16.1"
apache-commons-lang = "org.apache.commons:commons-lang3:3.21.0"
apache-compress = "org.apache.commons:commons-compress:1.27.1"
