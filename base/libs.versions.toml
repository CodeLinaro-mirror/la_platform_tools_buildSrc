# Proto runtime version differs to the proto compiler version (tools/base/bazel/proto.bzl)
# We do not want to unnecessarily update the compiler version as it can cause issues specifically
# to user who bring in older versions of protoc in parent classloaders of AGP.
# Important note: We should keep the major versions of the compiler and the runtime same to avoid
# potential compatibility issues
protobuf = { module = "com.google.protobuf:protobuf-java", version.ref = "protobuf" }
protobuf-util = { module = "com.google.protobuf:protobuf-java-util", version.ref = "protobuf" }
proto-compiler = { module = "com.google.protobuf:protoc", version.ref = "protoCompiler" }
protobuf-gradle-plugin = "com.google.protobuf:protobuf-gradle-plugin:0.10.0"

tensorflow-lite-metadata = "org.tensorflow:tensorflow-lite-metadata:0.2.0"

#When updating jacoco versions also update JacocoOptions.DEFAULT_VERSION
jacoco-agent = { module = "org.jacoco:org.jacoco.agent", version.ref = "jacoco" }
