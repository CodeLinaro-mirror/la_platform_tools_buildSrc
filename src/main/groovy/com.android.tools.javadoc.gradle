afterEvaluate {
    javadoc {
        exclude "**/internal/**"
        options.memberLevel = org.gradle.external.javadoc.JavadocMemberLevel.PROTECTED
        options.encoding = "UTF-8"
        options.addStringOption('Xdoclint:-missing', '-quiet')
        title=project.ext.pomName
    }
}

check.dependsOn javadoc
