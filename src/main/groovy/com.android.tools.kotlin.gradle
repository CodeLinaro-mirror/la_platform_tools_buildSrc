plugins {
    id "kotlin"
}

import org.gradle.internal.jvm.Jvm
import org.jetbrains.kotlin.gradle.tasks.KotlinCompile
import org.jetbrains.kotlin.gradle.tasks.UsesKotlinJavaToolchain
import org.gradle.internal.os.OperatingSystem

String jdk8Folder
if (OperatingSystem.current().isWindows()) {
    jdk8Folder = "win64"
} else if (OperatingSystem.current().isLinux()) {
    jdk8Folder = "linux"
} else if (OperatingSystem.current().isMacOsX()) {
    jdk8Folder = "mac/Contents/Home"
} else {
    throw new IllegalStateException("Unsupported operating system: " + OperatingSystem.current())
}

String jdk8Home = "${rootDir.parent}/prebuilts/studio/jdk/$jdk8Folder"

tasks.withType(KotlinCompile).configureEach {
    kotlinOptions {
        jvmTarget = "1.8"
        apiVersion = "1.5"
        languageVersion = "1.5"
        freeCompilerArgs = ((freeCompilerArgs + ["-Xjvm-default=enable", "-Xsam-conversions=class", "-Xuse-ir"]) as Set) as List
    }
}

project.tasks
        .withType(UsesKotlinJavaToolchain.class)
        .configureEach {
            it.kotlinJavaToolchain.jdk.use(
                    jdk8Home,
                    JavaVersion.VERSION_1_8
            )
        }

project.ext.toolsJarForJava8 = Jvm.forHome(new File(jdk8Home)).toolsJar
