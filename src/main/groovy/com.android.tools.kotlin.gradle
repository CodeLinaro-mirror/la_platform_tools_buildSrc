plugins {
    id "kotlin"
}

import org.gradle.internal.jvm.Jvm
import org.jetbrains.kotlin.gradle.tasks.KotlinCompile
import org.gradle.internal.os.OperatingSystem

String jdk8Folder
if (OperatingSystem.current().isWindows()) {
    jdk8Folder = "win64"
} else if (OperatingSystem.current().isLinux()) {
    jdk8Folder = "linux"
} else if (OperatingSystem.current().isMacOsX()) {
    jdk8Folder = "mac/Contents/Home"
} else {
    throw new IllegalStateException("Unsupported operating system: " + OperatingSystem.current())
}

String jdk8Home = "${rootDir.parent}/prebuilts/studio/jdk/$jdk8Folder"

tasks.withType(KotlinCompile).configureEach {
    kotlinOptions {
        jvmTarget = "1.8"
        apiVersion = "1.3"
        freeCompilerArgs = ((freeCompilerArgs + [
                "-Xjvm-default=enable",
                // Dependency jars may be compiled with a new kotlinc IR backend.
		// In particular `com.google.testing.platform.api.config` is
		// built with the IR backend. Once we update to a dependency
		// built with 1.4.30 we can remove this flag. The build that needs
		// the flag is `./gradlew publishLocal`.
                "-Xallow-unstable-dependencies",
                "-Xuse-ir"
        ]) as Set) as List
        jdkHome = jdk8Home
    }
}

project.ext.toolsJarForJava8 = Jvm.forHome(new File(jdk8Home)).toolsJar
